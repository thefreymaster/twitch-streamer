name: Twitch Streamer
version: "0.6.5"
slug: twitch_streamer
description: Stream a Home Assistant camera to Twitch when a trigger entity enters configured states, with chat updates from print sensors
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: services
boot: auto
host_network: true
homeassistant_api: true
options:
  trigger_entity: "sensor.h2s_0938aj622701347_print_status"
  start_states:
    - "running"
    - "prepare"
  stop_states:
    - "finish"
    - "idle"
    - "failed"
    - "offline"
    - "pause"
  camera_entity: "camera.h2s_printer_camera"
  rtsp_override: ""
  twitch_ingest_url: "rtmp://live.twitch.tv/app"
  twitch_key: ""
  video_bitrate: "3000k"
  preset: "veryfast"
  video_codec: "libx264"
  poll_seconds: 5
  # Stop streaming only after a stop_state persists this many consecutive polls.
  # Filters transient printer/MQTT glitches (e.g. brief offline/failed) that
  # would otherwise kill a long-running stream.
  stop_confirm_polls: 3
  # Restart ffmpeg if its output time stops advancing this many seconds.
  # Recovers from a frozen feed when the HA camera HLS stream restarts its
  # worker mid-print (EXT-X-DISCONTINUITY). Set 0 to disable.
  stall_restart_seconds: 30
  # Twitch API (optional — leave client_id blank to disable title/chat updates)
  twitch_client_id: ""
  twitch_client_secret: ""
  twitch_access_token: ""
  twitch_refresh_token: ""
  twitch_broadcaster_login: ""
  # Print metadata entities (used for title + chat messages)
  # file_entity = task_name (project name, e.g. "DoorWrench"), NOT gcode_filename
  # which returns the plate path (/data/Metadata/plate_1.gcode -> "plate_1").
  file_entity: "sensor.h2s_0938aj622701347_task_name"
  progress_entity: "sensor.h2s_0938aj622701347_print_progress"
  material_entity: "sensor.h2s_0938aj622701347_active_tray"
  remaining_time_entity: "sensor.h2s_0938aj622701347_remaining_time"
  current_layer_entity: "sensor.h2s_0938aj622701347_current_layer"
  total_layers_entity: "sensor.h2s_0938aj622701347_total_layer_count"
  progress_step: 10
schema:
  trigger_entity: str
  start_states:
    - str
  stop_states:
    - str
  camera_entity: str?
  rtsp_override: str?
  twitch_ingest_url: str
  twitch_key: password
  video_bitrate: str
  preset: list(ultrafast|superfast|veryfast|faster|fast|medium)
  video_codec: list(copy|libx264)
  poll_seconds: int(1,60)
  stop_confirm_polls: int(1,60)?
  stall_restart_seconds: int(0,3600)?
  twitch_client_id: str?
  twitch_client_secret: password?
  twitch_access_token: password?
  twitch_refresh_token: password?
  twitch_broadcaster_login: str?
  file_entity: str?
  progress_entity: str?
  material_entity: str?
  remaining_time_entity: str?
  current_layer_entity: str?
  total_layers_entity: str?
  progress_step: int(1,50)
