name: Twitch Streamer
version: "0.6.2"
slug: twitch_streamer
description: Stream a Home Assistant camera to Twitch when a trigger entity enters configured states, with chat updates from print sensors
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: services
boot: auto
host_network: true
homeassistant_api: true
options:
  trigger_entity: "sensor.a1_03919c442700723_print_status"
  start_states:
    - "running"
    - "prepare"
  stop_states:
    - "finish"
    - "idle"
    - "failed"
    - "offline"
    - "pause"
  camera_entity: "camera.h2s_printer_camera"
  rtsp_override: ""
  twitch_ingest_url: "rtmp://live.twitch.tv/app"
  twitch_key: ""
  video_bitrate: "3000k"
  preset: "veryfast"
  video_codec: "libx264"
  poll_seconds: 5
  # Twitch API (optional — leave client_id blank to disable title/chat updates)
  twitch_client_id: ""
  twitch_client_secret: ""
  twitch_access_token: ""
  twitch_refresh_token: ""
  twitch_broadcaster_login: ""
  # Print metadata entities (used for title + chat messages)
  file_entity: "sensor.a1_03919c442700723_gcode_filename"
  progress_entity: "sensor.a1_03919c442700723_print_progress"
  material_entity: "sensor.a1_03919c442700723_active_tray"
  remaining_time_entity: "sensor.a1_03919c442700723_remaining_time"
  current_layer_entity: "sensor.a1_03919c442700723_current_layer"
  total_layers_entity: "sensor.a1_03919c442700723_total_layer_count"
  progress_step: 10
schema:
  trigger_entity: str
  start_states:
    - str
  stop_states:
    - str
  camera_entity: str?
  rtsp_override: str?
  twitch_ingest_url: str
  twitch_key: password
  video_bitrate: str
  preset: list(ultrafast|superfast|veryfast|faster|fast|medium)
  video_codec: list(copy|libx264)
  poll_seconds: int(1,60)
  twitch_client_id: str?
  twitch_client_secret: password?
  twitch_access_token: password?
  twitch_refresh_token: password?
  twitch_broadcaster_login: str?
  file_entity: str?
  progress_entity: str?
  material_entity: str?
  remaining_time_entity: str?
  current_layer_entity: str?
  total_layers_entity: str?
  progress_step: int(1,50)
